apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-app
  namespace: campus-workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-app
  template:
    metadata:
      labels:
        app: campus-app
    spec:
      containers:
      - name: app
        image: campus-feedback:k8s-v1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: campus-config
        - secretRef:
            name: campus-demo-credentials
        env:
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: campus-app
  namespace: campus-workshop
spec:
  type: NodePort
  selector:
    app: campus-app
  ports:
  - port: 80
    targetPort: http
    nodePort: 30080
